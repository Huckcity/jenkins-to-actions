stages: [build, test, deploy]

variables:
  NODE_ENV: test
  DOCKER_DRIVER: overlay2

default:
  image: node:20
  before_script:
    - npm ci

cache:
  key:
    files: [package-lock.json]
  paths: [node_modules/]

.deploy-template:
  stage: deploy
  image: alpine:3.19
  before_script: []
  script:
    - apk add --no-cache curl
    - ./deploy.sh $CI_COMMIT_SHA $DEPLOY_ENV

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

lint:
  stage: test
  needs: []
  script: npm run lint
  allow_failure: true

unit:
  stage: test
  script:
    - npm test -- --reporter junit --output junit.xml
  artifacts:
    reports:
      junit: junit.xml
  parallel: 3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

integration:
  stage: test
  services:
    - postgres:16
    - name: redis:7
      alias: cache
  variables:
    POSTGRES_PASSWORD: pw
    DATABASE_URL: postgres://postgres:pw@postgres/test
  script:
    - npm run test:integration
  timeout: 1h 30m
  only:
    - main
    - /^release\/.*$/

docker:
  stage: deploy
  image: docker:27
  services: [docker:27-dind]
  before_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy-staging:
  extends: .deploy-template
  variables:
    DEPLOY_ENV: staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-prod:
  extends: .deploy-template
  variables:
    DEPLOY_ENV: production
  environment: production
  when: manual
  only:
    - tags
