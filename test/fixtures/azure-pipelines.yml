name: $(Build.DefinitionName)-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include: [main, release/*]
  paths:
    exclude: [docs/*]

pr:
  branches:
    include: [main]

schedules:
  - cron: "0 3 * * 1-5"
    displayName: Nightly
    branches:
      include: [main]

parameters:
  - name: deployTarget
    displayName: Deploy target
    type: string
    default: staging
    values: [staging, production]
  - name: runPerf
    type: boolean
    default: false

variables:
  - name: buildConfiguration
    value: Release
  - group: shared-secrets
  - name: artifactDir
    value: $(Build.ArtifactStagingDirectory)

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: build
        displayName: Build and test
        strategy:
          matrix:
            linux:
              imageName: ubuntu-latest
              node: 20
            windows:
              imageName: windows-latest
              node: 18
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            fetchDepth: 1
          - task: NodeTool@0
            inputs:
              versionSpec: $(node)
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: $(npm_config_cache)
          - script: npm ci
            displayName: Install
          - script: npm test -- --reporter=junit
            displayName: Test
            env:
              CI: true
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: '**/junit.xml'
          - task: DotNetCoreCLI@2
            displayName: Build API
            inputs:
              command: build
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration)'
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: $(artifactDir)
              artifactName: drop

  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy
        environment: ${{ parameters.deployTarget }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: my-service-connection
                    appName: my-api-${{ parameters.deployTarget }}
                    package: $(Pipeline.Workspace)/drop
                - bash: |
                    echo "Deployed $(Build.BuildNumber) to ${{ parameters.deployTarget }}"
                    curl -fsS https://my-api.example.com/health
                  displayName: Smoke test
      - job: perf
        dependsOn: deploy
        condition: eq('${{ parameters.runPerf }}', 'true')
        steps:
          - script: npm run perf
