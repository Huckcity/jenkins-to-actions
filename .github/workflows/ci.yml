name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Convert fixtures and lint with actionlint
        run: npm test
  timing:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - uses: Huckcity/step-timing@v1
